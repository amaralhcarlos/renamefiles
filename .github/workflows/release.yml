name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_path: dist/renamefiles-linux
          - os: windows-latest
            asset_path: dist/renamefiles-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y python3-tk && break
            echo "Tentativa $i falhou, tentando novamente..."
            sleep 10
          done

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --windowed --name renamefiles rename_files.py

      - name: Rename artifact (Linux)
        if: runner.os == 'Linux'
        run: mv dist/renamefiles dist/renamefiles-linux

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: mv dist/renamefiles.exe dist/renamefiles-windows.exe

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_path }}
